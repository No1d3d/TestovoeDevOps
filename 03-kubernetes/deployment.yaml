apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-info-app
  namespace: go-info-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-info-app
  template:
    metadata:
      labels:
        app: go-info-app
    spec:
      containers:
        - name: app
          image: no1d3d/go-info-app:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
