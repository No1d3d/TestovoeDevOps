name: Build, Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./01-application
          push: true
          tags: |
            no1d3d/go-info-app:latest
            no1d3d/go-info-app:${{ github.sha }}

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate manifests (client-side dry-run)
        run: |
          for f in 03-kubernetes/*.yaml; do
            echo "Validating $f"
            kubectl apply --dry-run=client -f "$f"
          done

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Update deployment image
        run: |
          kubectl set image deployment/go-info-app app=no1d3d/go-info-app:${{ github.sha }} -n go-info-app
          kubectl rollout status deployment/go-info-app -n go-info-app
